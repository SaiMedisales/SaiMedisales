<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai Medisales - Animated Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Header animation styles */
        .header-hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none; /* Prevents interaction when hidden */
        }
        
        .header-visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto; /* Allows interaction when visible */
        }
    </style>
</head>
<body class="bg-gray-50">
    <header id="header" class="fixed w-full top-0 z-50 bg-white/95 rounded-full backdrop-blur-md shadow-lg transition-all duration-700 ease-in-out header-hidden">
        <nav class="container mx-auto flex justify-between items-center py-4 px-6 lg:px-12">
            <a href="#home" class="flex items-center space-x-3 group">
                <img src="Logo .jpg" alt="Sai Medisales Logo" class="h-12 w-auto">
                <span class="text-3xl font-bold text-blue-600 hover:text-blue-800 transition duration-300 ease-in-out group-hover:scale-105">
                    Sai Medisales
                </span>
            </a>
            
            <ul class="hidden md:flex space-x-8">
                <li><a href="#home" class="text-blue-600 font-medium transition-colors">Home</a></li>
                <li><a href="products.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Our Products</a></li>
                <li><a href="#about" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">About Us</a></li>
                <li><a href="contact.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Connect Us</a></li>
            </ul>
            
            <div class="hidden md:flex items-center space-x-4">
                <a href="tel:+919822514631" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-full hover:shadow-lg transition-all duration-300 flex items-center space-x-2 pulse-animation">
                    <i class="fas fa-phone-alt"></i>
                    <span class="font-medium">Call Now</span>
                </a>
            </div>
            
            <button id="mobile-menu-button" class="md:hidden text-gray-700 hover:text-blue-600" aria-label="Toggle navigation">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </nav>
        
        <div id="mobile-nav" class="md:hidden hidden bg-white border-t">
            <ul class="flex flex-col space-y-4 p-6">
                <li><a href="#home" class="block text-blue-600 font-medium">Home</a></li>
                <li><a href="products.html" class="block text-gray-700 hover:text-blue-600 font-medium">Our Products</a></li>
                <li><a href="#about" class="block text-gray-700 hover:text-blue-600 font-medium">About Us</a></li>
                <li><a href="contact.html" class="block text-gray-700 hover:text-blue-600 font-medium">Connect Us</a></li>       
                <li>
                    <a href="tel:+919822514631" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-full inline-flex items-center space-x-2">
                        <i class="fas fa-phone-alt"></i>
                        <span>Call Now</span>
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.getElementById('header');
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileNav = document.getElementById('mobile-nav');
            
            // Simplified scroll detection for header animation
            window.addEventListener('scroll', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > 50) { // Show header after scrolling down 50px
                    header.classList.remove('header-hidden');
                    header.classList.add('header-visible');
                } else { // Hide header when at the very top of the page
                    header.classList.remove('header-visible');
                    header.classList.add('header-hidden');
                }
            });

            // Mobile menu toggle
            mobileMenuButton.addEventListener('click', function() {
                mobileNav.classList.toggle('hidden');
            });

            // Close mobile menu when clicking on links
            const mobileLinks = mobileNav.querySelectorAll('a');
            mobileLinks.forEach(link => {
                link.addEventListener('click', function() {
                    mobileNav.classList.add('hidden');
                });
            });
        });
    </script>
</body>
</html>
