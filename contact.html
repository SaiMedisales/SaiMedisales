<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queries - Sai Medisales</title>
    <meta name="description" content="Submit your queries to Sai Medisales for prompt assistance and information regarding our veterinary products.">

    <link rel="icon" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/favicon-32x32.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/android-chrome-512x512.png">
    <link rel="manifest" href="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/site.webmanifest">

    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="https://raw.githubusercontent.com/SaiMedisales/SaiMedisales/main/mstile-150x150.png">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="py-16 md:py-24 flex-grow container mx-auto px-6">
        <h2 class="section-heading text-3xl md:text-4xl font-bold text-center mb-12">Submit Your Query</h2>
        <p class="text-center text-gray-700 mb-10 max-w-2xl mx-auto">
            Please use the form below to submit any questions, feedback, or specific inquiries you may have. Our team will get back to you as soon as possible.
        </p>

        <div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Your Name</label>
                    <input type="text" id="name" name="name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" name="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                    <input type="text" id="subject" name="subject" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700">Your Message</label>
                    <textarea id="message" name="message" rows="6" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required></textarea>
                </div>
                <div>
                    <button type="submit" class="w-full btn btn-primary py-2 px-4 rounded-md">
                        Submit Query
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="main.js" defer></script>
    <script src="loadComponents.js" defer></script>
</body>
</html>
