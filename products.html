<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - Sai Medisales</title>
    <meta name="description" content="Explore our comprehensive range of veterinary medicines, dairy nutrition, poultry products, and pet care supplies at Sai Medisales in Baramati, Pune.">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
    <link rel="manifest" href="site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50">

    <div id="header-placeholder"></div>

    <main class="medical-pattern pt-20">
        
        <section class="hero-gradient-products py-20">
            <div class="container mx-auto px-6 lg:px-12 text-center fade-in">
                <h1 class="text-5xl lg:text-6xl font-bold text-white mb-6 font-poppins">
                    Our Products
                </h1>
                <p class="text-xl text-blue-100 max-w-3xl mx-auto leading-relaxed">
                    Explore our extensive range of high-quality veterinary, dairy, and pet care products.
                </p>
            </div>
        </section>

        <section class="py-16">
            <div class="container mx-auto px-6 lg:px-12">
                <div class="mb-12 text-center fade-in">
                    <h2 class="text-4xl font-bold text-gray-800 font-poppins mb-4">Product Categories</h2>
                    <p class="text-gray-600 text-lg">Browse our products by category to find what you need.</p>
                </div>
                
                <div id="filter-buttons" class="flex flex-wrap justify-center gap-4 mb-12 fade-in">
                    <button class="filter-btn active bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors hover:bg-blue-700" data-category="all">All Products</button>
                    <button class="filter-btn bg-white text-gray-700 font-semibold py-3 px-6 rounded-lg border border-gray-300 transition-colors hover:bg-gray-100" data-category="veterinary">Veterinary Medicines</button>
                    <button class="filter-btn bg-white text-gray-700 font-semibold py-3 px-6 rounded-lg border border-gray-300 transition-colors hover:bg-gray-100" data-category="dairy">Dairy Nutrition</button>
                    <button class="filter-btn bg-white text-gray-700 font-semibold py-3 px-6 rounded-lg border border-gray-300 transition-colors hover:bg-gray-100" data-category="poultry">Poultry Products</button>
                    <button class="filter-btn bg-white text-gray-700 font-semibold py-3 px-6 rounded-lg border border-gray-300 transition-colors hover:bg-gray-100" data-category="pet">Pet Care</button>
                </div>

                <div id="products-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8 fade-in">
                </div>
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script src="loadComponents.js"></script>
    <script type="module" src="products.js"></script>
</body>
</html>
