<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai Medisales - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
</head>
<body>
    <header id="header-placeholder"></header>

    <main>
        <section class="hero-banner">
            <img src="Hero Banner.jpg" alt="Hero banner for Sai Medisales, showing various animal products.">
        </section>

        <section class="newsletter-signup">
            <h2>Subscribe to our Newsletter</h2>
            <form id="newsletter-form">
                <input type="email" name="email" placeholder="Your Email" required>
                <button type="submit">Subscribe</button>
            </form>
            <div id="newsletter-message" style="display: none;"></div>
        </section>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="loadComponents.js"></script>
    <script src="main.js"></script>
    <script>
        document.getElementById('newsletter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('newsletter-message');
            messageDiv.style.display = 'block';
            messageDiv.textContent = 'Thank you for subscribing to our newsletter!';
        });
    </script>
</body>
</html>
